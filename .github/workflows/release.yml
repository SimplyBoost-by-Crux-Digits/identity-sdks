name: Release

# Push a tag vX.Y.Z to release all three packages at that version.
# npm and PyPI publish only after a maintainer approves the "release"
# environment; Packagist reads the tag from GitHub on its own.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  versions:
    name: Versions match the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: check
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          node_version=$(node -p "require('./node/package.json').version")
          py_version=$(python3 -c "import tomllib;print(tomllib.load(open('python/pyproject.toml','rb'))['project']['version'])")
          py_module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/simplyboost_identity/__init__.py)
          echo "tag=$version npm=$node_version pypi=$py_version module=$py_module"
          for v in "$node_version" "$py_version" "$py_module"; do
            if [ "$v" != "$version" ]; then echo "::error::version $v does not match tag $TAG"; exit 1; fi
          done
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no [$version] section"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build packages
    needs: [test, versions]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: npm package
        working-directory: node
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/npm
          npm pack --pack-destination ../dist/npm
      - name: Python package
        working-directory: python
        run: |
          python -m pip install build==1.3.0 twine==6.2.0
          python -m build --outdir ../dist/pypi
          python -m twine check --strict ../dist/pypi/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://www.npmjs.com/package/@simplyboost/identity
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm 11.5.1 or later (trusted publishing)
        run: npm install -g npm@11.6.2
      - name: Publish
        # Trusted publishing (OIDC) needs no token. NPM_TOKEN is only for the
        # very first publish, before the package exists on npm; delete the
        # secret once trusted publishing is set up.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/npm/*.tgz --access public --provenance

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/simplyboost-identity/
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/pypi/

  github-release:
    name: GitHub release
    needs: [versions, publish-npm, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.versions.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          gh release create "${{ github.ref_name }}" dist/npm/* dist/pypi/* --title "${{ github.ref_name }}" --notes-file notes.md --verify-tag
