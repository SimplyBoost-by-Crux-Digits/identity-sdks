[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "simplyboost-identity"
version = "1.0.0"
description = "HMAC identity verification for the SimplyBoost AI chat widget: sign the logged-in user's email in Django, Flask or any Python backend."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crux Digits B.V. (SimplyBoost)", email = "hello@simplyboost.io" }]
keywords = [
  "simplyboost",
  "chat widget",
  "chatbot",
  "identity verification",
  "user identity",
  "hmac",
  "user_hash",
  "django",
  "flask",
  "customer portal",
  "ai assistant",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://simplyboost.io"
Documentation = "https://simplyboost.io/docs/verified-visitors"
Source = "https://github.com/SimplyBoost-by-Crux-Digits/identity-sdks"
Issues = "https://github.com/SimplyBoost-by-Crux-Digits/identity-sdks/issues"
Changelog = "https://github.com/SimplyBoost-by-Crux-Digits/identity-sdks/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simplyboost_identity = ["py.typed"]
